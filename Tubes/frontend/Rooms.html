<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Kamar Hotel</title>
</head>
<body>
  <h1>Manajemen Data Kamar - DBSystemHotels</h1>
  <form id="roomForm">
    <input type="number" id="room_id" placeholder="ID Kamar" required>
    <input type="number" id="room_type" placeholder="Tipe Kamar (angka)" required>
    <input type="number" id="price" placeholder="Harga per Malam" required>
    <input type="number" id="availability" placeholder="Ketersediaan (misal 1/2)" required>
    <input type="number" id="bed_count" placeholder="Jumlah Tempat Tidur" required>
    <input type="text" id="image_interior" placeholder="URL Gambar Interior" required>
    <input type="text" id="image_exterior" placeholder="URL Gambar Exterior" required>
    <button type="submit">Tambah Kamar</button>
  </form>

  <ul id="roomList"></ul>

  <script>
    const apiURL = 'http://localhost:3000/api/rooms';

    async function loadRooms() {
      const res = await fetch(apiURL);
      const data = await res.json();
      const list = document.getElementById('roomList');
      list.innerHTML = '';
      data.forEach(room => {
        const imagesHTML = room.images?.map(img => `[${img.type}: ${img.url}]`).join(', ') || '';
        const li = document.createElement('li');
        li.innerHTML = `
          <strong>Room ID: ${room.room_id}</strong> - Type: ${room.room_type} - Rp${room.price} - Avail: ${room.availability} - Beds: ${room.bed_count}<br>
          Images: ${imagesHTML}<br>
          <button onclick="hapusRoom('${room._id}')">Hapus</button>
          <button onclick='editRoom("${room._id}", ${room.room_id}, ${room.room_type}, ${room.price}, ${room.availability}, ${room.bed_count}, ${JSON.stringify(room.images).replace(/"/g, '&quot;')})'>Edit</button>
          <hr>
        `;
        list.appendChild(li);
      });
    }

    async function tambahRoom(e) {
      e.preventDefault();
      const newRoom = {
        room_id: parseInt(document.getElementById('room_id').value),
        room_type: parseInt(document.getElementById('room_type').value),
        price: parseFloat(document.getElementById('price').value),
        availability: parseInt(document.getElementById('availability').value),
        bed_count: parseInt(document.getElementById('bed_count').value),
        images: [
          { type: 'interior', url: document.getElementById('image_interior').value },
          { type: 'exterior', url: document.getElementById('image_exterior').value }
        ]
      };

      await fetch(apiURL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newRoom)
      });

      document.getElementById('roomForm').reset();
      loadRooms();
    }

    async function hapusRoom(id) {
      await fetch(`${apiURL}/${id}`, { method: 'DELETE' });
      loadRooms();
    }

    function editRoom(id, room_id, room_type, price, availability, bed_count, images) {
      document.getElementById('room_id').value = room_id;
      document.getElementById('room_type').value = room_type;
      document.getElementById('price').value = price;
      document.getElementById('availability').value = availability;
      document.getElementById('bed_count').value = bed_count;

      const parsedImages = images;
      if (parsedImages && parsedImages.length === 2) {
        const interior = parsedImages.find(img => img.type === 'interior');
        const exterior = parsedImages.find(img => img.type === 'exterior');
        document.getElementById('image_interior').value = interior ? interior.url : '';
        document.getElementById('image_exterior').value = exterior ? exterior.url : '';
      }

      const form = document.getElementById('roomForm');
      form.onsubmit = async function(e) {
        e.preventDefault();
        const updatedRoom = {
          room_id: parseInt(document.getElementById('room_id').value),
          room_type: parseInt(document.getElementById('room_type').value),
          price: parseFloat(document.getElementById('price').value),
          availability: parseInt(document.getElementById('availability').value),
          bed_count: parseInt(document.getElementById('bed_count').value),
          images: [
            { type: 'interior', url: document.getElementById('image_interior').value },
            { type: 'exterior', url: document.getElementById('image_exterior').value }
          ]
        };

        await fetch(`${apiURL}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updatedRoom)
        });

        form.reset();
        form.onsubmit = tambahRoom;
        loadRooms();
      };
    }

    document.getElementById('roomForm').onsubmit = tambahRoom;
    loadRooms();
  </script>
</body>
</html>
