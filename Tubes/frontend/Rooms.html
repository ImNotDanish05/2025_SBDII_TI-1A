<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Kamar Hotel</title>
</head>
<body>
  <h1>Manajemen Data Kamar - DBSystemHotels</h1>
  <form id="roomForm">
    <input type="number" id="room_id" placeholder="ID Kamar" required>
    <input type="number" id="room_type" placeholder="Tipe Kamar (angka)" required>
    <input type="number" id="price" placeholder="Harga per Malam" required>
    <input type="number" id="availability" placeholder="Ketersediaan (misal 1/2)" required>
    <input type="number" id="bed_count" placeholder="Jumlah Tempat Tidur" required>
    <input type="text" id="image_type" placeholder="Tipe Gambar (interior/exterior)" required>
    <input type="text" id="image_url" placeholder="URL Gambar" required>
    <button type="submit">Tambah Kamar</button>
  </form>

  <ul id="roomList"></ul>

  <script>
    const apiURL = 'http://localhost:3000/api/rooms';

    async function loadRooms() {
      const res = await fetch(apiURL);
      const data = await res.json();
      const list = document.getElementById('roomList');
      list.innerHTML = '';
      data.forEach(room => {
        let imagesHTML = '';
        if (room.images && Array.isArray(room.images)) {
          imagesHTML = room.images.map(img => `[${img.type}: ${img.url}]`).join(', ');
        }
        const li = document.createElement('li');
        li.innerHTML = `
          <strong>Room ID: ${room.room_id}</strong> - Type: ${room.room_type} - Rp${room.price} - Avail: ${room.availability} - Beds: ${room.bed_count}<br>
          Images: ${imagesHTML}<br>
          <button onclick="hapusRoom('${room._id}')">Hapus</button>
          <button onclick='editRoom("${room._id}", "${room.room_id}", "${room.room_type}", "${room.price}", "${room.availability}", "${room.bed_count}", "${JSON.stringify(room.images).replace(/"/g, '&quot;')}")'>Edit</button>
          <hr>
        `;
        list.appendChild(li);
      });
    }

    async function tambahRoom(e) {
      e.preventDefault();
      const room_id = document.getElementById('room_id').value;
      const room_type = document.getElementById('room_type').value;
      const price = document.getElementById('price').value;
      const availability = document.getElementById('availability').value;
      const bed_count = document.getElementById('bed_count').value;
      const image_type = document.getElementById('image_type').value;
      const image_url = document.getElementById('image_url').value;

      await fetch(apiURL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          room_id,
          room_type,
          price,
          availability,
          bed_count,
          images: [
            { type: image_type, url: image_url }
          ]
        })
      });

      document.getElementById('roomForm').reset();
      loadRooms();
    }

    async function hapusRoom(id) {
      await fetch(`${apiURL}/${id}`, { method: 'DELETE' });
      loadRooms();
    }

    function editRoom(id, room_id, room_type, price, availability, bed_count, imagesJSON) {
      const images = JSON.parse(imagesJSON);
      document.getElementById('room_id').value = room_id;
      document.getElementById('room_type').value = room_type;
      document.getElementById('price').value = price;
      document.getElementById('availability').value = availability;
      document.getElementById('bed_count').value = bed_count;
      if (images && images.length > 0) {
        document.getElementById('image_type').value = images[0].type;
        document.getElementById('image_url').value = images[0].url;
      }

      const form = document.getElementById('roomForm');
      form.onsubmit = async function(e) {
        e.preventDefault();
        const updatedImages = [
          {
            type: document.getElementById('image_type').value,
            url: document.getElementById('image_url').value
          }
        ];

        await fetch(`${apiURL}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            room_id: document.getElementById('room_id').value,
            room_type: document.getElementById('room_type').value,
            price: document.getElementById('price').value,
            availability: document.getElementById('availability').value,
            bed_count: document.getElementById('bed_count').value,
            images: updatedImages
          })
        });

        form.reset();
        form.onsubmit = tambahRoom;
        loadRooms();
      };
    }

    document.getElementById('roomForm').onsubmit = tambahRoom;
    loadRooms();
  </script>
</body>
</html>
