<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Tamu</title>
</head>
<body>
    <h1>Manajemen Tamu - ImNotDanish05</h1>
    <form id="guestForm">
        <input type="number" id="guest_id" placeholder="Guest ID" required>
        <input type="text" id="name" placeholder="Nama Tamu" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="phone_number" placeholder="Nomor Telepon" required>
        <input type="text" id="address" placeholder="Alamat" required>
        <button type="submit">Tambah Tamu</button>
    </form>

    <ul id="guestList"></ul>

    <script>
        const apiURL = 'http://localhost:3000/api/guests';

        async function loadGuests() {
            const res = await fetch(apiURL);
            const data = await res.json();
            const list = document.getElementById('guestList');
            list.innerHTML = '';
            data.forEach(guest => {
                const li = document.createElement('li');
                li.innerHTML = `
                    ${guest.name} - ${guest.email} - ${guest.phone_number} - ${guest.address}
                    <button onclick="hapusGuest('${guest._id}')">Hapus</button>
                    <button onclick='editGuest("${guest._id}",
                        "${guest.guest_id}",
                        "${guest.name}",
                        "${guest.email}",
                        "${guest.phone_number}",
                        "${guest.address}")'>Edit</button>
                    <hr>`;
                list.appendChild(li);
            });
        }

        async function tambahGuest(e) {
            e.preventDefault();
            const guest_id = document.getElementById('guest_id').value;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone_number = document.getElementById('phone_number').value;
            const address = document.getElementById('address').value;

            await fetch(apiURL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    guest_id,
                    name,
                    email,
                    phone_number,
                    address
                })
            });

            document.getElementById('guestForm').reset();
            loadGuests();
        }

        async function hapusGuest(id) {
            await fetch(`${apiURL}/${id}`, {
                method: 'DELETE'
            });
            loadGuests();
        }

        function editGuest(id, guest_id, name, email, phone_number, address) {
            document.getElementById('guest_id').value = guest_id;
            document.getElementById('name').value = name;
            document.getElementById('email').value = email;
            document.getElementById('phone_number').value = phone_number;
            document.getElementById('address').value = address;

            const form = document.getElementById('guestForm');
            form.onsubmit = async function(e) {
                e.preventDefault();
                await fetch(`${apiURL}/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        guest_id: document.getElementById('guest_id').value,
                        name: document.getElementById('name').value,
                        email: document.getElementById('email').value,
                        phone_number: document.getElementById('phone_number').value,
                        address: document.getElementById('address').value
                    })
                });
                form.reset();
                form.onsubmit = tambahGuest;
                loadGuests();
            };
        }

        document.getElementById('guestForm').onsubmit = tambahGuest;
        loadGuests();
    </script>
</body>
</html>
